<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自強活動 — 查詢系統</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{
      --primary:#4f46e5;--primary-dark:#3730a3;
      --success:#10b981;--error:#ef4444;
      --text:#1e293b;--muted:#64748b;--border:#e2e8f0;--radius:12px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:"Microsoft JhengHei","PingFang TC",Arial,sans-serif;
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      min-height:100vh;display:flex;align-items:center;
      justify-content:center;padding:16px;
    }
    .card{
      background:#fff;border-radius:20px;padding:36px;
      width:100%;max-width:460px;
      box-shadow:0 25px 50px rgba(0,0,0,0.25);
    }
    .logo{text-align:center;margin-bottom:28px;}
    .logo h1{font-size:1.6em;color:var(--text);font-weight:700;}
    .logo p{color:var(--muted);font-size:0.9em;margin-top:4px;}
    .search-row{display:flex;gap:8px;margin-bottom:18px;}
    .search-row input{
      flex:1;padding:13px 16px;border:2px solid var(--border);
      border-radius:var(--radius);font-size:1em;font-family:inherit;
      outline:none;transition:border-color 0.2s;
    }
    .search-row input:focus{border-color:var(--primary);}
    .btn{
      padding:13px 22px;border:none;border-radius:var(--radius);
      font-size:1em;font-weight:700;cursor:pointer;
      font-family:inherit;transition:all 0.2s;
    }
    .btn-primary{background:var(--primary);color:#fff;}
    .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);}
    .btn-ghost{
      width:100%;background:transparent;border:2px solid var(--border);
      color:var(--muted);margin-top:8px;
    }
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
    .result-card{
      background:linear-gradient(135deg,#f0f9ff,#e0f2fe);
      border:1px solid #bae6fd;border-radius:var(--radius);
      padding:20px;margin-bottom:20px;
    }
    .result-header{
      display:flex;align-items:center;gap:10px;
      margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #bae6fd;
    }
    .result-name{font-size:1.2em;font-weight:700;color:var(--text);}
    .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .result-item{background:#fff;border-radius:8px;padding:12px;text-align:center;}
    .result-item .lbl{font-size:0.75em;color:var(--muted);margin-bottom:4px;}
    .result-item .val{font-size:1.05em;font-weight:700;color:var(--primary);}
    .error-box{
      background:#fef2f2;border:1px solid #fecaca;
      border-radius:var(--radius);padding:16px;
      text-align:center;color:var(--error);margin-bottom:20px;
    }
    .qr-wrap{
      border-top:1px solid var(--border);padding-top:22px;
      margin-top:6px;text-align:center;
    }
    .qr-wrap h3{
      font-size:0.8em;color:var(--muted);text-transform:uppercase;
      letter-spacing:0.07em;margin-bottom:14px;font-weight:700;
    }
    #qrcode{
      display:inline-block;padding:12px;background:#fff;
      border:1px solid var(--border);border-radius:10px;margin-bottom:10px;
    }
    #qrcode canvas,#qrcode img{display:block;}
    .qr-url{font-size:0.72em;color:var(--muted);word-break:break-all;margin-bottom:12px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeUp 0.3s ease;}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>🎉 自強活動</h1>
    <p>員工活動資訊查詢</p>
  </div>
  <div class="search-row">
    <input type="text" id="emp-input" placeholder="請輸入員編"
           onkeydown="if(event.key==='Enter')doSearch()"
           autocomplete="off" inputmode="text">
    <button class="btn btn-primary" onclick="doSearch()">查詢</button>
  </div>
  <div id="result-area"></div>
  <div class="qr-wrap">
    <h3>揃描 QR Code 開啟此查詢頁面</h3>
    <div id="qrcode"></div>
    <p class="qr-url" id="qr-url-text"></p>
    <button class="btn btn-ghost" onclick="downloadQR()">⬇️ 下載 QR Code 圖片</button>
  </div>
</div>

window.addEventListener("DOMContentLoaded",function(){
  var url=window.location.href;
  document.getElementById("qr-url-text").textContent=url;
  new QRCode(document.getElementById("qrcode"),{
    text:url,width:180,height:180,
    colorDark:"#1e293b",colorLight:"#ffffff",
    correctLevel:QRCode.CorrectLevel.M
  });
});
function doSearch(){
  var empId=document.getElementById("emp-input").value.trim();
  var area=document.getElementById("result-area");
  if(!empId){area.innerHTML='<div class="error-box fade-in">請輸入員編後再查詢</div>';return;}
  var found=null;
  for(var i=0;i<EMPLOYEE_DATA.length;i++){if(EMPLOYEE_DATA[i].empId===empId){found=EMPLOYEE_DATA[i];break;}}
  if(found){
    area.innerHTML='<div class="result-card fade-in"><div class="result-header"><span style="font-size:1.6em">✅</span><span class="result-name">'+esc(found.name)+'</span></div>'+
    '<div class="result-grid">'+
    '<div class="result-item"><div class="lbl">員編</div><div class="val">'+esc(found.empId)+'</div></div>'+
    '<div class="result-item"><div class="lbl">組別</div><div class="val">'+esc(found.group)+'</div></div>'+
    '<div class="result-item"><div class="lbl">房號</div><div class="val">'+esc(found.room)+'</div></div>'+
    '<div class="result-item"><div class="lbl">晚宴桌次</div><div class="val">'+esc(found.table)+'</div></div>'+
    '</div></div>';
  }else{
    area.innerHTML='<div class="error-box fade-in">❌ 查無員編「'+esc(empId)+'」，請確認後再試</div>';
  }
}
function downloadQR(){
  var canvas=document.querySelector("#qrcode canvas");
  var img=document.querySelector("#qrcode img");
  var src=canvas?canvas.toDataURL("image/png"):(img?img.src:null);
  if(!src){alert("QR Code 尚未生成");return;}
  var a=document.createElement("a");
  a.href=src;a.download="活動查詢QRCode.png";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
